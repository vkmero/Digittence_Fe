<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Attendance | Digittence</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

  body {
    background: url("https://images.unsplash.com/photo-1519389950473-47ba0277781c") no-repeat center / cover fixed;
    min-height: 100vh;
    color: #fff;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 0;
  }

  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .navbar h2 { font-size: 18px; font-weight: 600; }
  .nav-btn {
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
  }

  .page {
    position: relative;
    z-index: 1;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .filters-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .filters-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .filters-card input,
  .filters-card select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }

  .filters-card input:focus,
  .filters-card select:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 0 2px rgba(0,229,255,0.2);
  }

  .filters-card select option { background: #1a1a2e; color: #fff; }

  .filters-card input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    opacity: 0.7;
  }

  .filters-card input::placeholder { color: rgba(255,255,255,0.5); }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .btn {
    padding: 11px 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    transition: transform 0.15s, opacity 0.15s;
    text-align: center;
  }
  .btn:active { transform: scale(0.96); opacity: 0.85; }

  .btn-blue  { background: #2196F3; color: #fff; }
  .btn-green { background: #00c853; color: #fff; }
  .btn-teal  { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  .students-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .student-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.2s;
  }

  .student-card.is-present { border-color: rgba(0,200,83,0.6); background: rgba(0,200,83,0.08); }
  .student-card.is-absent  { border-color: rgba(229,57,53,0.6); background: rgba(229,57,53,0.08); }

  .student-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .student-name {
    font-size: 16px;
    font-weight: 600;
  }

  .student-roll {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.1);
    padding: 3px 10px;
    border-radius: 20px;
  }

  .student-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .pa-group {
    display: flex;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    overflow: hidden;
    flex: 1;
  }

  .pa-btn {
    flex: 1;
    padding: 11px 0;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: background 0.2s, color 0.2s;
    background: transparent;
    color: rgba(255,255,255,0.4);
  }

  .pa-btn.active-p { background: #00c853; color: #fff; }
  .pa-btn.active-a { background: #e53935; color: #fff; }

  .edit-del-group {
    display: flex;
    gap: 6px;
  }

  .mini-btn {
    padding: 9px 14px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: transform 0.15s;
  }
  .mini-btn:active { transform: scale(0.94); }
  .mini-edit   { background: #ffc107; color: #000; }
  .mini-delete { background: #e53935; color: #fff; }

  .save-btn {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #00c853, #00e5ff);
    color: #000;
    font-size: 17px;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    margin-bottom: 30px;
    letter-spacing: 0.3px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .save-btn:active { transform: scale(0.98); }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: none;
    justify-content: center;
    align-items: flex-end;
    z-index: 200;
  }
  .modal.open { display: flex; }

  .modal-sheet {
    width: 100%;
    max-width: 600px;
    background: #1a1a2e;
    border-radius: 22px 22px 0 0;
    padding: 24px 20px 36px;
    animation: slideUp 0.3s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-sheet h3 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #fff;
    text-align: center;
  }

  .modal-sheet input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    margin-bottom: 12px;
    outline: none;
  }
  .modal-sheet input:focus { border-color: #00e5ff; }
  .modal-sheet input::placeholder { color: rgba(255,255,255,0.4); }

  .modal-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 4px;
  }

  .modal-btns button {
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    opacity: 0.5;
    font-size: 15px;
  }
</style>
</head>

<body>
<div class="overlay"></div>

<nav class="navbar">
  <h2>Mark Attendance</h2>
  <button class="nav-btn" onclick="logout()">Logout</button>
</nav>

<div class="page">

  <div class="filters-card">
    <div class="filters-row">
      <input type="date" id="date" required>
      <input type="number" id="hours" placeholder="Hours" min="1" required>
    </div>
    <select id="subjectSelect"></select>
    <div class="action-row">
      <button class="btn btn-blue"  onclick="openSubjectModal()">+ Subject</button>
      <button class="btn btn-green" onclick="openStudentModal()">+ Student</button>
      <button class="btn btn-teal"  onclick="triggerFileUpload()">Upload</button>
    </div>
    <input type="file" id="studentFile" accept=".xlsx,.csv" style="display:none" onchange="uploadStudentFile()">
  </div>

  <!-- Students list -->
  <div class="students-list" id="studentsList">
    <div class="empty-state">Loading students…</div>
  </div>

  <!-- Save -->
  <button class="save-btn" onclick="saveAttendance()">Save Attendance</button>
</div>

<div class="modal" id="subjectModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3>Add Subject</h3>
    <input type="text" id="newSubjectName" placeholder="Subject name">
    <div class="modal-btns">
      <button style="background:#e53935;color:#fff" onclick="closeSubjectModal()">Cancel</button>
      <button style="background:#00c853;color:#fff" onclick="addSubject()">Add</button>
    </div>
  </div>
</div>

<div class="modal" id="studentModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <h3 id="studentModalTitle">Add Student</h3>
    <input type="text" id="newStudentName" placeholder="Full name">
    <input type="text" id="newStudentRoll" placeholder="Roll number">
    <div class="modal-btns">
      <button style="background:#e53935;color:#fff" onclick="closeStudentModal()">Cancel</button>
      <button style="background:#00c853;color:#fff" onclick="addStudent()">Save</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
let students = [];
let editingStudentId = null;

function getClassId() {
  const id = localStorage.getItem("selectedClass");
  if (!id) window.location.href = "classes.html";
  return id;
}

async function initAttendance() {
  const classId = getClassId();
  document.getElementById("date").valueAsDate = new Date();
  await loadSubjectsDropdown(classId);
  await loadStudentsTable(classId);
}

async function loadSubjectsDropdown(classId) {
  const subjects = await fetchAPI(`https://digittence-be-ut26.onrender.com/api/subjects/${classId}`);
  const select = document.getElementById("subjectSelect");
  select.innerHTML = subjects.length
    ? subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('')
    : '<option value="">No subjects yet</option>';
}

async function loadStudentsTable(classId) {
  students = await fetchAPI(`https://digittence-be-ut26.onrender.com/api/students/${classId}`);
  renderStudents();
}

function renderStudents() {
  const list = document.getElementById("studentsList");
  if (!students.length) {
    list.innerHTML = '<div class="empty-state">No students yet. Add one above.</div>';
    return;
  }
  list.innerHTML = students.map(s => `
    <div class="student-card" id="card-${s._id}">
      <div class="student-info">
        <span class="student-name">${s.name}</span>
        <span class="student-roll">${s.rollNo}</span>
      </div>
      <div class="student-actions">
        <div class="pa-group">
          <button class="pa-btn" id="p-${s._id}" onclick="setStatus('${s._id}','P')">P</button>
          <button class="pa-btn" id="a-${s._id}" onclick="setStatus('${s._id}','A')">A</button>
        </div>
        <div class="edit-del-group">
          <button class="mini-btn mini-edit"   onclick="openEditStudent('${s._id}','${s.name}','${s.rollNo}')">Edit</button>
          <button class="mini-btn mini-delete" onclick="deleteStudentRow('${s._id}')">Del</button>
        </div>
      </div>
    </div>
  `).join('');
}

function setStatus(studentId, status) {
  const student = students.find(s => String(s._id) === String(studentId));
  if (!student) return;
  student.status = status;

  const pBtn = document.getElementById(`p-${studentId}`);
  const aBtn = document.getElementById(`a-${studentId}`);
  const card = document.getElementById(`card-${studentId}`);

  pBtn.className = 'pa-btn' + (status === 'P' ? ' active-p' : '');
  aBtn.className = 'pa-btn' + (status === 'A' ? ' active-a' : '');
  card.className = 'student-card ' + (status === 'P' ? 'is-present' : 'is-absent');
}

function openSubjectModal() {
  document.getElementById("newSubjectName").value = "";
  document.getElementById("subjectModal").classList.add("open");
}
function closeSubjectModal() {
  document.getElementById("subjectModal").classList.remove("open");
}
async function addSubject() {
  const name = document.getElementById("newSubjectName").value.trim();
  if (!name) return;
  await fetchAPI("https://digittence-be-ut26.onrender.com/api/subjects", "POST", { name, class: getClassId() });
  closeSubjectModal();
  await loadSubjectsDropdown(getClassId());
}

function openStudentModal() {
  editingStudentId = null;
  document.getElementById("studentModalTitle").textContent = "Add Student";
  document.getElementById("newStudentName").value = "";
  document.getElementById("newStudentRoll").value = "";
  document.getElementById("studentModal").classList.add("open");
}
function openEditStudent(id, name, rollNo) {
  editingStudentId = id;
  document.getElementById("studentModalTitle").textContent = "Edit Student";
  document.getElementById("newStudentName").value = name;
  document.getElementById("newStudentRoll").value = rollNo;
  document.getElementById("studentModal").classList.add("open");
}
function closeStudentModal() {
  document.getElementById("studentModal").classList.remove("open");
}
async function addStudent() {
  const name = document.getElementById("newStudentName").value.trim();
  const rollNo = document.getElementById("newStudentRoll").value.trim();
  if (!name || !rollNo) return;
  if (editingStudentId) {
    await fetchAPI(`https://digittence-be-ut26.onrender.com/api/students/${editingStudentId}`, "PUT", { name, rollNo });
  } else {
    await fetchAPI("https://digittence-be-ut26.onrender.com/api/students", "POST", { name, rollNo, class: getClassId() });
  }
  closeStudentModal();
  await loadStudentsTable(getClassId());
}
async function deleteStudentRow(id) {
  if (!confirm("Delete student?")) return;
  await fetchAPI(`https://digittence-be-ut26.onrender.com/api/students/${id}`, "DELETE");
  await loadStudentsTable(getClassId());
}

async function saveAttendance() {
  const classId = getClassId();
  const subject = document.getElementById("subjectSelect").value;
  const date    = document.getElementById("date").value;
  const hours   = Number(document.getElementById("hours").value);
  if (!subject || !date || !hours) { alert("Please fill all fields."); return; }
  const records = students.map(s => ({ student: s._id, status: s.status || "A" }));
  await fetchAPI("https://digittence-be-ut26.onrender.com/api/attendance", "POST", { class: classId, subject, date, hours, records });
  alert("Attendance Saved!");
  students.forEach(s => delete s.status);
  renderStudents();
}

function triggerFileUpload() { document.getElementById("studentFile").click(); }
async function uploadStudentFile() {
  const fileInput = document.getElementById("studentFile");
  const file = fileInput.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  const token = localStorage.getItem("token");
  const response = await fetch(`https://digittence-be-ut26.onrender.com/api/students/upload/${getClassId()}`, {
    method: "POST", headers: { Authorization: `Bearer ${token}` }, body: formData
  });
  const data = await response.json();
  if (!response.ok) { alert(data.message); return; }
  alert(`${data.count} students uploaded!`);
  fileInput.value = "";
  await loadStudentsTable(getClassId());
}

document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

window.onload = () => { checkAuth(); initAttendance(); };
</script>
</body>
</html>
