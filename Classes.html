<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Classes | Digittence</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }

    body {
      background: url("https://images.unsplash.com/photo-1519389950473-47ba0277781c") no-repeat center/cover fixed;
      min-height: 100vh;
      color: #fff;
    }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:0; }

    .navbar {
      position: sticky; top:0; z-index:100;
      display: flex; justify-content:space-between; align-items:center;
      padding: 14px 16px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .navbar h2 { font-size:18px; font-weight:600; }
    .nav-btn {
      padding:8px 18px; border-radius:20px;
      background:rgba(255,255,255,0.2); color:#fff;
      border:none; cursor:pointer; font-size:14px; font-family:'Poppins',sans-serif;
    }

    .page {
      position:relative; z-index:1;
      padding:16px; max-width:600px; margin:0 auto;
    }

    .page-title {
      font-size:22px; font-weight:700;
      margin-bottom:16px; text-align:center;
    }

    .create-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      border-radius:18px;
      padding:18px 16px;
      margin-bottom:20px;
      border:1px solid rgba(255,255,255,0.2);
      display:flex; flex-direction:column; gap:12px;
    }

    .create-card label {
      font-size:13px; font-weight:600;
      color:#00e5ff; letter-spacing:0.5px;
    }

    .create-card input {
      width:100%; padding:13px 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.25);
      background:rgba(255,255,255,0.15);
      color:#fff; font-size:15px;
      font-family:'Poppins',sans-serif; outline:none;
    }
    .create-card input:focus {
      border-color:#00e5ff;
      box-shadow:0 0 0 2px rgba(0,229,255,0.2);
    }
    .create-card input::placeholder { color:rgba(255,255,255,0.4); }

    .create-btn {
      width:100%; padding:14px;
      border-radius:12px; border:none;
      background: linear-gradient(135deg,#00e5ff,#6a5acd);
      color:#000; font-size:16px; font-weight:700;
      font-family:'Poppins',sans-serif;
      cursor:pointer; transition:transform 0.2s;
    }
    .create-btn:active { transform:scale(0.97); }

    .classes-list {
      display:flex; flex-direction:column; gap:12px;
    }

    .class-card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      border-radius:16px;
      padding:16px;
      border:1px solid rgba(255,255,255,0.18);
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .class-name {
      font-size:18px; font-weight:600;
    }

    .class-btns {
      display:grid;
      grid-template-columns:2fr 1fr 1fr;
      gap:8px;
    }

    .class-btns button {
      padding:12px 8px;
      border-radius:10px; border:none;
      font-size:14px; font-weight:600;
      font-family:'Poppins',sans-serif;
      cursor:pointer;
      transition:transform 0.15s;
    }
    .class-btns button:active { transform:scale(0.95); }

    .btn-open   { background:#00c853; color:#fff; }
    .btn-edit   { background:#ffc107; color:#000; }
    .btn-delete { background:#e53935; color:#fff; }

    .empty-state {
      text-align:center; padding:40px 20px;
      opacity:0.5; font-size:15px;
    }
  </style>
</head>
<body>
<div class="overlay"></div>

<nav class="navbar">
  <h2>Classes</h2>
  <button class="nav-btn" onclick="logout()">Logout</button>
</nav>

<div class="page">
  <p class="page-title">Manage Classes</p>

  <div class="create-card">
    <label>CLASS NAME</label>
    <input type="text" id="className" placeholder="e.g. CSE-3A">
    <button class="create-btn" onclick="createClass()">+ Create Class</button>
  </div>

  <div class="classes-list" id="classList">
    <div class="empty-state">Loading classes…</div>
  </div>
</div>

<script src="script.js"></script>
<script>
async function loadClasses() {
  const classes = await fetchAPI('https://digittence-be-ut26.onrender.com/api/classes');
  const list = document.getElementById('classList');
  if (!classes.length) {
    list.innerHTML = '<div class="empty-state">No classes yet. Create one above.</div>';
    return;
  }
  list.innerHTML = classes.map(c => `
    <div class="class-card">
      <div class="class-name">${c.className}</div>
      <div class="class-btns">
        <button class="btn-open"   onclick="openClass('${c._id}')">Open</button>
        <button class="btn-edit"   onclick="editClass('${c._id}','${c.className}')">Edit</button>
        <button class="btn-delete" onclick="deleteClass('${c._id}')">Delete</button>
      </div>
    </div>
  `).join('');
}

async function createClass() {
  const className = document.getElementById('className').value.trim();
  if (!className) return;
  await fetchAPI('https://digittence-be-ut26.onrender.com/api/classes', 'POST', { className });
  document.getElementById('className').value = '';
  loadClasses();
}

function openClass(id) {
  localStorage.setItem('selectedClass', id);
  window.location.href = 'class.html';
}

async function editClass(id, currentName) {
  const newName = prompt("New class name:", currentName);
  if (!newName || !newName.trim()) return;
  await fetchAPI(`https://digittence-be-ut26.onrender.com/api/classes/${id}`, "PUT", { className: newName });
  loadClasses();
}

async function deleteClass(id) {
  if (!confirm("Delete this class?")) return;
  await fetchAPI(`https://digittence-be-ut26.onrender.com/api/classes/${id}`, "DELETE");
  loadClasses();
}

window.onload = () => { checkAuth(); loadClasses(); };
</script>
</body>
</html>
