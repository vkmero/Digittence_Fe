<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digittence | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
.btn-primary:disabled { opacity: 0.75; cursor: not-allowed; }
.spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="overlay"></div>

<section class="hero-section" style="justify-content:center;">
    
    <form id="forgotForm" class="glass-form">

        <h2 class="form-title">Reset Password</h2>

        <p style="text-align:center; margin-bottom:20px; opacity:0.85;">
            Enter your registered email and we will send you a reset link.
        </p>

        <div class="input-group">
            <input type="email" id="email" required>
            <label>Email Address</label>
        </div>

        <button type="submit" id="forgotBtn" class="btn-primary ripple" style="width:100%;">
    Send Reset Link
</button>

        <p style="margin-top:20px; text-align:center;">
            Remembered your password?
            <a href="login.html" style="color:#00e5ff;">Login</a>
        </p>

    </form>

</section>

<script>
document.getElementById('forgotForm').addEventListener('submit', async e => {
    e.preventDefault();

    const btn = document.getElementById('forgotBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading...';

    const email = document.getElementById('email').value;
    try {
        const res = await fetch('https://digittence-be-ut26.onrender.com/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
        alert(data.message || "If email exists, reset link sent.");
    } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
        alert("Server error. Please try again.");
    }
});
</script>

</body>
</html>
