<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Digittence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <style>
.btn-primary:disabled { opacity: 0.75; cursor: not-allowed; }
.spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3); border-top-color: #000;
    border-radius: 50%; animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="overlay"></div>

<nav class="navbar">
    <h2>Digittence</h2>
    <a href="register.html" class="nav-btn">Register</a>
</nav>

<section class="hero-section" style="justify-content:center;">
    <form id="registerForm" class="glass-form">

        <h2 class="form-title">Faculty Registration</h2>

        <div class="input-group">
            <input type="text" id="name" required>
            <label>Full Name</label>
        </div>

        <div class="input-group">
            <input type="email" id="email" required>
            <label>Email</label>
        </div>

        <div class="input-group password-group">
            <input type="password" id="password" required>
            <label>Password</label>
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
        </div>

        <button type="submit" id="registerBtn" class="btn-primary ripple" style="width:100%;">
    Register
</button>

        <p style="margin-top:15px; text-align:center;">
            Already have an account?
            <a href="login.html" style="color:#00e5ff;">Login</a>
        </p>

    </form>
</section>

<script src="script.js"></script>
<script>
function togglePassword() {
    const pass = document.getElementById("password");
    pass.type = pass.type === "password" ? "text" : "password";
}

document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading...';

    try {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        await fetchAPI('https://digittence-be-ut26.onrender.com/api/auth/register', 'POST', {
            name, email, password
        });
        alert("Registration successful! Please login.");
        window.location.href = 'login.html';
    } catch(err) {
        btn.disabled = false;
        btn.innerHTML = 'Register';
        alert(err.message);
    }
});
</script>

</body>
</html>
